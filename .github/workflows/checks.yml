name: Проверки игры
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  game:
    name: Логика и комплект поставки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить поведение
        run: node --test tests/*.test.js
      - name: Проверить безопасность упаковки
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Проверить ограничения и упаковать
        run: python3 scripts/package_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: bukva-za-bukvoy-game
          path: |
            artifacts/bukva-za-bukvoy-game.zip
            artifacts/bukva-za-bukvoy-game.json
          if-no-files-found: error
